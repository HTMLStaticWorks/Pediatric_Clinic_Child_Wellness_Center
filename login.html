<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parent Login | LittleSteps Pediatric Clinic</title>
    <meta name="description" content="LittleSteps pediatric clinic parent portal login.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body class="auth-page">
    <main class="page" style="min-height:auto;display:flex;align-items:center;justify-content:center;padding:40px 0">
        <div class="auth-wrap" style="padding:0">
            <div class="auth-art"><img src="assets/service_wellchild.jpg"
                    alt="Real family healthcare photograph in a bright pediatric setting"></div>
            <div class="auth-panel">
                <div class="auth-box">
                    <a class="logo logo-centered" href="index.html"><img src="assets/logo.png"
                            alt="LittleSteps Pediatric Clinic" class="logo-img"></a>
                    <h1 style="text-align:center">Welcome back</h1>
                    <p style="text-align:center">Sign in to the parent portal demo.</p>
                    <form class="form-grid" onsubmit="event.preventDefault();window.location='dashboard.html'">
                        <div class="field full"><label>Email address</label><input type="email" required
                                value="parent@example.com" placeholder="you@example.com"></div>
                        <div class="field full"><label>Password</label>
                            <div class="password-wrap">
                                <input type="password" required value="password" placeholder="Enter password">
                                <button type="button" class="password-toggle"
                                    aria-label="Toggle password visibility">👁️</button>
                            </div>
                        </div>
                        <div class="field full auth-options">
                            <label class="checkline"><input type="checkbox" checked> Remember me</label>
                            <a href="#" data-action="forgotPass" class="forgot-link">Forgot password?</a>
                        </div>
                        <div class="field full"><button class="btn btn-primary" style="width:100%">Sign in to dashboard
                                →</button></div>
                    </form>
                    <div class="auth-switch">New parent? <a href="signup.html">Create an account</a></div>
                    <div class="note" style="text-align:center">Demo mode: no real medical records, payments or
                        credentials are processed.</div>
                </div>
            </div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="assets/site.js"></script>
</body>

</html>
