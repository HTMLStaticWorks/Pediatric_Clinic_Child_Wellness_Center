<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parent Sign Up | LittleSteps Pediatric Clinic</title>
    <meta name="description"
        content="LittleSteps pediatric clinic parent portal sign up.">
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body class="auth-page">
    <main class="page" style="min-height:auto;display:flex;align-items:center;justify-content:center;padding:40px 0">
        <div class="auth-wrap" style="padding:0">
            <div class="auth-panel">
                <div class="auth-box">
                    <a class="logo logo-centered" href="index.html"><img src="assets/logo.png" alt="LittleSteps Pediatric Clinic" class="logo-img"></a>
                    <h1 style="text-align:center">Create your parent account</h1>
                    <p style="text-align:center">Set up a family profile to organize your children's care.</p>
                    <form class="form-grid" onsubmit="event.preventDefault();window.location='dashboard.html'">
                        <div class="field full"><label>First name</label><input required placeholder="First name"></div>
                        <div class="field full"><label>Last name</label><input required placeholder="Last name"></div>
                        <div class="field full"><label>Email address</label><input type="email" required
                                placeholder="you@example.com"></div>
                        <div class="field full"><label>Phone number</label><input required placeholder="Phone number"></div>
                        <div class="field full"><label>Password</label>
                            <div class="password-wrap">
                                <input type="password" required placeholder="Create password">
                                <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
                            </div>
                        </div>
                        <div class="field full"><label>Confirm password</label>
                            <div class="password-wrap">
                                <input type="password" required placeholder="Confirm password">
                                <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
                            </div>
                        </div>
                        <div class="field full"><label class="checkline"><input type="checkbox" required><span>I agree to the demo <a href="#" style="color:var(--blue);font-weight:700" onclick="event.preventDefault();toast('Demo terms and privacy notice.');">terms and privacy notice</a>.</span></label></div>
                        <div class="field full"><button class="btn btn-primary" style="width:100%">Create account
                                →</button></div>
                    </form>
                    <div class="auth-switch">Already registered? <a href="login.html">Sign in</a></div>
                </div>
            </div>
            <div class="auth-art"><img
                    src="assets/service_vaccination.jpg"
                    alt="Real family healthcare photograph in a bright pediatric setting"></div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="assets/site.js"></script>
</body>

</html>
