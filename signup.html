<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Parent Sign Up | LittleSteps Pediatric Clinic</title>
    <meta name="description"
        content="LittleSteps pediatric clinic parent portal sign up.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body class="auth-page">
    <div style="position:absolute;top:20px;right:20px;z-index:10;display:flex;gap:8px">
        <button class="btn-theme" data-theme-btn aria-label="Toggle theme" title="Toggle theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
        <button class="btn-theme btn-rtl" data-rtl-btn aria-label="Toggle RTL or LTR mode" title="Toggle RTL/LTR">RTL</button>
    </div>
    <main class="page" style="min-height:auto;display:flex;align-items:center;justify-content:center;padding:40px 0">
        <div class="auth-wrap" style="padding:0">
            <div class="auth-panel">
                <div class="auth-box">
                    <a class="logo logo-centered" href="index.html"><img src="assets/logo.png" alt="LittleSteps Pediatric Clinic" class="logo-img"></a>
                    <h1 style="text-align:center">Create your parent account</h1>
                    <p style="text-align:center">Set up a family profile to organize your children's care.</p>
                    <form class="form-grid" onsubmit="event.preventDefault();window.location='dashboard.html'">
                        <div class="field full"><label>First name</label><input required placeholder="First name"></div>
                        <div class="field full"><label>Last name</label><input required placeholder="Last name"></div>
                        <div class="field full"><label>Email address</label><input type="email" required
                                placeholder="you@example.com"></div>
                        <div class="field full"><label>Phone number</label><input required placeholder="Phone number"></div>
                        <div class="field full"><label>Password</label>
                            <div class="password-wrap">
                                <input type="password" required placeholder="Create password">
                                <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
                            </div>
                        </div>
                        <div class="field full"><label>Confirm password</label>
                            <div class="password-wrap">
                                <input type="password" required placeholder="Confirm password">
                                <button type="button" class="password-toggle" aria-label="Toggle password visibility">👁️</button>
                            </div>
                        </div>
                        <div class="field full"><label class="checkline"><input type="checkbox" required><span>I agree to the demo <a href="#" style="color:var(--blue);font-weight:700" onclick="event.preventDefault();toast('Demo terms and privacy notice.');">terms and privacy notice</a>.</span></label></div>
                        <div class="field full"><button class="btn btn-primary" style="width:100%">Create account
                                →</button></div>
                    </form>

                    <div class="social-auth-divider"><span>Or sign up with</span></div>
                    <div class="social-auth-grid">
                        <button type="button" class="btn-social-auth" onclick="event.preventDefault();window.location='dashboard.html'">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            Google
                        </button>
                        <button type="button" class="btn-social-auth" onclick="event.preventDefault();window.location='dashboard.html'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.84c.66-.8 1.11-1.92.99-3.04-.96.04-2.12.64-2.8 1.44-.61.71-1.14 1.86-1 2.96 1.08.08 2.16-.56 2.81-1.36z"/></svg>
                            Apple
                        </button>
                        <button type="button" class="btn-social-auth" onclick="event.preventDefault();window.location='dashboard.html'">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                            Facebook
                        </button>
                    </div>

                    <div class="auth-switch">Already registered? <a href="login.html">Sign in</a></div>
                </div>
            </div>
            <div class="auth-art"><img
                    src="assets/service_vaccination.jpg"
                    alt="Real family healthcare photograph in a bright pediatric setting"></div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="assets/site.js"></script>
</body>

</html>
